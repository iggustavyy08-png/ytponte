<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponte YouTube</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style></head>
<body>
<script>
// Página de ponte: roda em https (GitHub Pages), então o YouTube aceita tocar o vídeo aqui dentro.
// Repassa as mensagens do player do YouTube para o app e os comandos do app para o YouTube.
(function () {
  var q = new URLSearchParams(location.search);
  var id = (q.get('v') || '').replace(/[^\w-]/g, '');
  if (!id) return;
  var extra = q.get('p') || '';
  var f = document.createElement('iframe');
  f.allow = 'autoplay; encrypted-media; fullscreen';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.src = 'https://www.youtube.com/embed/' + id + '?enablejsapi=1&playsinline=1&rel=0&modestbranding=1&origin=' + encodeURIComponent(location.origin) + (extra ? '&' + extra.replace(/[^\w=&.-]/g, '') : '');
  document.body.appendChild(f);
  window.addEventListener('message', function (e) {
    if (e.source === f.contentWindow) { parent.postMessage(e.data, '*'); }
    else if (e.source === parent && typeof e.data === 'string') { f.contentWindow.postMessage(e.data, '*'); }
  });
})();
</script>
</body></html>
